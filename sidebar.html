<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信文章编辑器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      color: #fff;
    }
    .header {
      padding: 10px 15px;
      background: #2d2d2d;
      border-bottom: 1px solid #404040;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #07c160;
      color: #fff;
    }
    .btn-primary:hover {
      background: #06b057;
    }
    .btn-secondary {
      background: #404040;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #4a4a4a;
    }
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #404040;
    }
    .panel-header {
      padding: 8px 12px;
      background: #252526;
      font-size: 13px;
      color: #888;
      border-bottom: 1px solid #404040;
    }
    .editor-wrapper {
      flex: 1;
      display: flex;
    }
    .editor-left, .editor-right {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .editor-label {
      padding: 6px 12px;
      background: #2d2d2d;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #404040;
    }
    textarea {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 12px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .preview-wrapper {
      flex: 1;
      background: #fff;
      overflow: auto;
    }
    .preview-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .config-bar {
      padding: 8px 12px;
      background: #252526;
      border-top: 1px solid #404040;
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 12px;
    }
    .config-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .config-item label {
      color: #888;
    }
    .config-item input[type="text"] {
      background: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      width: 150px;
    }
    .config-item button {
      padding: 4px 8px;
      background: #404040;
      border: none;
      color: #fff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    .config-item button:hover {
      background: #4a4a4a;
    }
    .footer {
      padding: 8px 15px;
      background: #252526;
      border-top: 1px solid #404040;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #07c160;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 微信文章编辑器</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="settingsBtn">设置</button>
      <button class="btn btn-primary" id="copyBtn">一键复制</button>
    </div>
  </div>

  <div class="main-container">
    <div class="editor-panel">
      <div class="panel-header">HTML 编辑器</div>
      <div class="editor-wrapper">
        <div class="editor-left">
          <div class="editor-label">正文内容</div>
          <textarea id="htmlEditor" placeholder="在这里输入HTML内容..."></textarea>
        </div>
      </div>
    </div>

    <div class="preview-panel">
      <div class="panel-header">预览</div>
      <div class="preview-wrapper">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </div>

  <div class="config-bar">
    <div class="config-item">
      <label>顶部模板:</label>
      <input type="text" id="headerFile" value="header.html" placeholder="header.html">
      <button id="editHeaderBtn">编辑</button>
    </div>
    <div class="config-item">
      <label>底部模板:</label>
      <input type="text" id="footerFile" value="footer.html" placeholder="footer.html">
      <button id="editFooterBtn">编辑</button>
    </div>
    <div class="config-item">
      <button id="refreshBtn" class="btn btn-secondary">重置模板</button>
    </div>
  </div>

  <div class="footer">
    <span>提示: 点击"一键复制"后，可直接粘贴到微信公众号编辑器</span>
    <span>v1.0</span>
  </div>

  <div class="toast" id="toast">复制成功！</div>

  <script src="sidebar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信文章编辑器 - Markdown</title>
  <style>
    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f0f2f5;
      color: #1a1a1a;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #b0b0b0; }

    /* ===== Top Bar ===== */
    .header {
      height: 52px;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #07c160, #05a050);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: 0.2px;
    }
    .header-divider {
      width: 1px;
      height: 18px;
      background: #e0e0e0;
      margin: 0 4px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 14px;
      height: 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-primary {
      background: #07c160;
      color: #fff;
      box-shadow: 0 1px 4px rgba(7,193,96,0.35);
    }
    .btn-primary:hover { background: #06ad56; box-shadow: 0 2px 8px rgba(7,193,96,0.4); }
    .btn-ghost {
      background: transparent;
      color: #555;
      border: 1px solid #e0e0e0;
    }
    .btn-ghost:hover { background: #f5f5f5; border-color: #ccc; color: #222; }
    .btn-danger { background: #ff4d4f; color: #fff; }
    .btn-danger:hover { background: #e03e40; }
    /* keep .btn-secondary for modal internals */
    .btn-secondary { background: #f0f0f0; color: #444; border: 1px solid #e0e0e0; }
    .btn-secondary:hover { background: #e8e8e8; }

    /* ===== Main Layout ===== */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 0;
    }

    /* ===== Editor Panel ===== */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 320px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
    }
    .panel-header {
      padding: 0 16px;
      height: 38px;
      background: #fafafa;
      border-bottom: 1px solid #efefef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-label {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .word-count {
      font-size: 12px;
      color: #bbb;
    }

    textarea#mdEditor {
      flex: 1;
      background: #fff;
      color: #2d2d2d;
      border: none;
      padding: 20px 24px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 1.75;
      resize: none;
      outline: none;
      tab-size: 2;
    }
    textarea#mdEditor::placeholder { color: #ccc; }

    /* ===== Preview Panel ===== */
    .preview-panel {
      flex: 0 0 440px;
      display: flex;
      flex-direction: column;
      background: #f0f2f5;
    }
    .preview-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    /* Phone-like frame */
    .preview-frame {
      width: 100%;
      max-width: 480px;
      min-height: 100%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
      flex-shrink: 0;
    }
    .preview-iframe {
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: none;
      display: block;
      background: #fff;
    }

    /* ===== Status Bar ===== */
    .statusbar {
      height: 28px;
      padding: 0 20px;
      background: #fafafa;
      border-top: 1px solid #ebebeb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .statusbar span {
      font-size: 11px;
      color: #bbb;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(30,30,30,0.88);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 9999;
      backdrop-filter: blur(6px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Modal Base ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #fff;
      border-radius: 12px;
      padding: 0;
      max-width: 520px;
      width: 92%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 16px 20px; }
    .modal-body textarea {
      width: 100%;
      height: 200px;
      background: #fafafa;
      color: #333;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    .modal-body textarea:focus { border-color: #07c160; }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ===== Theme Modal ===== */
    .theme-modal .modal-content {
      max-width: 780px;
      width: 96%;
    }
    .theme-modal .modal-body { padding: 16px 20px 20px; }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .theme-card {
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.18s ease;
      border: 2px solid #efefef;
      background: #fafafa;
    }
    .theme-card:hover {
      transform: translateY(-2px);
      border-color: #07c160;
      box-shadow: 0 4px 16px rgba(7,193,96,0.18);
    }
    .theme-card.active {
      border-color: #07c160;
      box-shadow: 0 0 0 1px #07c160;
    }
    .theme-preview {
      height: 90px;
      position: relative;
      overflow: hidden;
    }
    .theme-name {
      text-align: center;
      padding: 7px 6px;
      background: #fff;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #f0f0f0;
    }
    .theme-card.active .theme-name { color: #07c160; font-weight: 600; }

    /* ===== Template Modal ===== */
    .tpl-modal .modal-content {
      max-width: 680px;
      width: 95%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .tpl-modal .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    .tpl-list { display: flex; flex-direction: column; }
    .tpl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      border-bottom: 1px solid #f5f5f5;
      transition: background 0.12s;
    }
    .tpl-item:hover { background: #fafafa; }
    .tpl-item.active { background: #f0fdf6; }
    .tpl-item-name {
      flex: 1;
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tpl-item.active .tpl-item-name { color: #07c160; font-weight: 600; }
    .tpl-item-type {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      font-weight: 500;
    }
    .tpl-item-type.md { background: #eff6ff; color: #3b82f6; }
    .tpl-item-type.html { background: #fff7ed; color: #f97316; }
    .tpl-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tpl-item-actions button {
      padding: 3px 10px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .tpl-editor-area {
      padding: 16px 20px;
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
    }
    .tpl-editor-area label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .tpl-editor-area input[type="text"] {
      width: 100%;
      background: #fff;
      border: 1px solid #e8e8e8;
      color: #333;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      box-sizing: border-box;
    }
    .tpl-editor-area input[type="text"]:focus { border-color: #07c160; }
    .tpl-editor-area textarea {
      width: 100%;
      height: 180px;
      background: #fff;
      color: #333;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 10px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      resize: vertical;
      outline: none;
      box-sizing: border-box;
    }
    .tpl-editor-area textarea:focus { border-color: #07c160; }
    .tpl-editor-hint {
      font-size: 11px;
      color: #aaa;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ===== 各主题预览色块 ===== */
    /* 通用：预览区内的模拟排版元素用纯 CSS 绘制 */
    .theme-preview { font-size: 0; }

    /* 紫蓝渐变 */
    .prev-blue {
      background: linear-gradient(160deg, #f0f4ff 0%, #e0e7ff 100%);
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-blue::before {
      content: '';
      display: block; height: 12px; width: 70%;
      background: #4f46e5; border-radius: 3px; opacity: 0.85;
    }
    .prev-blue::after {
      content: '';
      display: block; height: 36px; width: 100%;
      background: #e0e7ff; border-left: 3px solid #6366f1;
      border-radius: 0 4px 4px 0; padding-left: 6px;
    }

    /* 橙色温暖 */
    .prev-orange {
      background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 100%);
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-orange::before {
      content: '';
      display: block; height: 12px; width: 65%;
      background: #ea580c; border-radius: 3px; opacity: 0.85;
      border-left: 4px solid #fb923c;
    }
    .prev-orange::after {
      content: '';
      display: block; height: 36px; width: 100%;
      background: #ffedd5; border-left: 4px solid #fb923c;
      border-radius: 0 4px 4px 0;
    }

    /* 清新绿 */
    .prev-green {
      background: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 100%);
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-green::before {
      content: '';
      display: block; height: 16px; width: 100%;
      background: #22c55e; border-radius: 4px;
    }
    .prev-green::after {
      content: '';
      display: block; height: 30px; width: 100%;
      background: #dcfce7; border-left: 4px solid #22c55e;
      border-radius: 0 4px 4px 0;
    }

    /* 可爱小黄猫 */
    .prev-cute-yellow {
      background: #fffbeb;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-cute-yellow::before {
      content: '';
      display: block; height: 10px; width: 55%;
      background: #f59e0b; border-radius: 2px; opacity: 0.7;
    }
    .prev-cute-yellow::after {
      content: '';
      display: block; height: 38px; width: 100%;
      background: #fef3c7; border: 1px solid #fbbf24; border-radius: 6px;
    }

    /* 淡紫技术风 */
    .prev-tech-purple {
      background: linear-gradient(160deg, #faf5ff 0%, #f3e8ff 100%);
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-tech-purple::before {
      content: '';
      display: block; height: 10px; width: 60%;
      background: #8b5cf6; border-radius: 2px; opacity: 0.8;
    }
    .prev-tech-purple::after {
      content: '';
      display: block; height: 38px; width: 100%;
      background: #f7eeff; border: 1px solid #dec6fb; border-radius: 6px;
    }

    /* 温暖活力风 */
    .prev-warm-orange {
      background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 100%);
      padding: 10px 10px 10px 16px;
      display: flex; flex-direction: column; gap: 6px;
      border-left: 5px solid #f97316;
    }
    .prev-warm-orange::before {
      content: '';
      display: block; height: 11px; width: 60%;
      background: #ea580c; border-radius: 2px;
    }
    .prev-warm-orange::after {
      content: '';
      display: block; height: 34px; width: 100%;
      background: linear-gradient(135deg, rgba(255,237,213,0.8), rgba(254,243,199,0.6));
      border-radius: 0 8px 8px 0;
    }

    /* 优雅紫色风 */
    .prev-elegant-purple {
      background: linear-gradient(160deg, #faf5ff 0%, #ede9fe 100%);
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-elegant-purple::before {
      content: '';
      display: block; height: 14px; width: 72%;
      background: linear-gradient(90deg, #8b5cf6, #a78bfa);
      border-radius: 3px;
    }
    .prev-elegant-purple::after {
      content: '';
      display: block; height: 34px; width: 100%;
      background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(167,139,250,0.08));
      border-left: 4px solid #8b5cf6; border-radius: 0 6px 6px 0;
    }

    /* 极客技术风 */
    .prev-geek-tech {
      background: #ffffff;
      padding: 10px;
      display: flex; flex-direction: column; gap: 5px;
      border: 1px solid #d0d7de;
    }
    .prev-geek-tech::before {
      content: '# Title';
      display: block; font-family: monospace; font-size: 11px;
      font-weight: 700; color: #0969da;
      border-bottom: 1px solid #d0d7de; padding-bottom: 4px;
    }
    .prev-geek-tech::after {
      content: '';
      display: block; height: 30px; width: 100%;
      background: #f6f8fa; border-left: 4px solid #0969da;
      border-radius: 0 4px 4px 0;
    }

    /* 波普撞色风 */
    .prev-pop-art {
      background: #ffffff;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-pop-art::before {
      content: '';
      display: block; height: 14px; width: 75%;
      background: #000; box-shadow: 3px 3px 0 #ffd43b;
    }
    .prev-pop-art::after {
      content: '';
      display: block; height: 32px; width: 100%;
      background: #fff; border: 3px solid #000;
      border-left-width: 8px; box-shadow: 4px 4px 0 #eee;
    }

    /* 简约蓝色系 */
    .prev-minimal-blue {
      background: #ffffff;
      padding: 10px 10px 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
      border-left: 4px solid #1a6dfc;
    }
    .prev-minimal-blue::before {
      content: '';
      display: block; height: 11px; width: 65%;
      background: #333; border-radius: 2px;
    }
    .prev-minimal-blue::after {
      content: '';
      display: block; height: 34px; width: 100%;
      background: #f0f4ff; border-radius: 4px;
    }

    /* 黑白简约风 */
    .prev-bw-minimal {
      background: #ffffff;
      background-image: linear-gradient(90deg,rgba(50,0,0,0.03) 0%,transparent 11.49%), linear-gradient(360deg,rgba(50,0,0,0.04) 0%,transparent 12.16%);
      background-size: 20px 20px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-bw-minimal::before {
      content: '';
      display: block; height: 16px; width: 100%;
      background: #000; border-radius: 2px;
    }
    .prev-bw-minimal::after {
      content: '';
      display: block; height: 30px; width: 100%;
      background: rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    /* 经典黄色系 */
    .prev-classic-yellow {
      background: #ffffff;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-classic-yellow::before {
      content: '';
      display: block; height: 14px; width: 70%;
      background: #000; border-bottom: 4px solid #f6c629;
      padding-bottom: 2px;
    }
    .prev-classic-yellow::after {
      content: '';
      display: block; height: 32px; width: 100%;
      background: rgba(249,199,37,0.12); border: 1px solid #f9c725;
      border-radius: 6px;
    }

    /* 霓虹色风格 */
    .prev-neon {
      background: #f8f8f8;
      background-image: linear-gradient(90deg,rgba(50,0,0,0.03) 0%,transparent 11.49%), linear-gradient(360deg,rgba(50,0,0,0.04) 0%,transparent 12.16%);
      background-size: 20px 20px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-neon::before {
      content: 'H1';
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 16px;
      background: linear-gradient(135deg, #ff0055, #d400ff);
      color: #fff; font-size: 9px; font-weight: 900;
      box-shadow: 0 0 8px rgba(255,0,85,0.7);
    }
    .prev-neon::after {
      content: '';
      display: block; height: 32px; width: 100%;
      background: rgba(255,61,113,0.05); border-left: 4px solid #ff3d71;
      border-radius: 0 4px 4px 0;
    }

    /* 水墨丹青 */
    .prev-ink-wash {
      background: #faf8f3;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .prev-ink-wash::before {
      content: '';
      display: block; height: 12px; width: 60%;
      background: linear-gradient(90deg, transparent, #8b4513, transparent);
      border-radius: 2px;
    }
    .prev-ink-wash::after {
      content: '';
      display: block; height: 34px; width: 100%;
      background: rgba(200,134,10,0.06); border-left: 4px solid #c8860a;
      border-radius: 0 4px 4px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-logo">✍️</div>
      <h1>微信文章编辑器</h1>
      <div class="header-divider"></div>
      <span style="font-size:12px;color:#bbb;">Markdown → 微信公众号</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="themeBtn">🎨 主题</button>
      <button class="btn btn-ghost" id="headerTplBtn">⬆ 顶部模版</button>
      <button class="btn btn-ghost" id="footerTplBtn">⬇ 底部模版</button>
      <button class="btn btn-ghost" id="resetBtn" title="重置所有缓存">↺</button>
      <button class="btn btn-primary" id="copyBtn">📋 一键复制</button>
    </div>
  </div>

  <div class="main-container">
    <div class="editor-panel">
      <div class="panel-header">
        <span class="panel-label">编辑器</span>
        <span class="word-count" id="wordCount">0 字</span>
      </div>
      <textarea id="mdEditor" placeholder="在这里输入 Markdown 内容...

# 标题一
## 标题二

**粗体**  *斜体*  ~~删除线~~

- 列表项
- 列表项

> 引用块

\`\`\`javascript
// 代码块
console.log('Hello')
\`\`\`

| 表头 | 表头 |
|------|------|
| 内容 | 内容 |"></textarea>
    </div>

    <div class="preview-panel">
      <div class="panel-header">

server {
    listen 80;
    server_name 47.102.41.227 hackertodo.com www.hackertodo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 47.102.41.227 hackertodo.com www.hackertodo.com;

    ssl_certificate /www/server/panel/vhost/cert/hackertodo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/hackertodo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /www/wwwroot/portfolio;
    index index.html;

    location = /md {
        return 301 /md/;
    }

    location = /happy {
        return 301 /happy/;
    }

    location = /api {
        return 301 /api/;
    }

    location /md/ {
        # html 入口：每次部署后无需手动清缓存
        add_header Cache-Control "no-cache";
        alias /www/wwwroot/wechat-md/;
        index index.html;
        try_files $uri $uri/ /md/index.html;
    }

    location /happy/ {
        alias /www/wwwroot/happy-english/;
        try_files $uri $uri/ /happy/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /md/assets/ {
        alias /www/wwwroot/wechat-md/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /www/wwwlogs/wechat-md.access.log;
    error_log /www/wwwlogs/wechat-md.error.log;
}
